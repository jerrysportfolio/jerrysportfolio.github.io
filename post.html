<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry Hu — Writing</title>
    <!-- PLACEHOLDER: favicon, see assets/placeholder/MANIFEST.md -->
    <link rel="icon" href="assets/placeholder/logo/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/v2.css">
</head>

<body class="v2" data-page="blog">

    <nav class="navbar">
        <a class="logo" href="index.html"><span>@</span>iamjerryhu</a>
        <div class="nav-links">
            <div class="nav-indicator" aria-hidden="true"></div>
            <a href="index.html" data-page="home">Home</a>
            <a href="projects.html" data-page="projects">Projects</a>
            <a href="blog.html" data-page="blog" class="active">Blogs</a>
            <a href="gallery.html" data-page="gallery">Gallery</a>
            <a href="about.html" data-page="about">About</a>
        </div>
        <a class="contact-link" href="mailto:[your@email.com]">Get in touch</a>
        <button class="nav-toggle" aria-label="Open menu">
            <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="22" height="2.4" fill="currentColor" />
                <rect y="11.6" width="22" height="2.4" fill="currentColor" />
            </svg>
        </button>
        <button class="nav-close" aria-label="Close menu">✕</button>
    </nav>

    <div class="v2-wrap">
        <main class="post-wrap page-content" id="page-content">
            <div class="reading-progress"></div>

            <a class="back-link" href="blog.html">← Back to writing</a>

            <div id="post-loading" class="empty-state">Loading…</div>

            <div id="post-content" hidden>
                <div class="post-meta">
                    <span id="post-date"></span> · <span class="b-tag" id="post-tag" style="margin-left:4px;"></span>
                </div>
                <h1 id="post-title" style="font-family:var(--font-display); font-size:clamp(1.8rem,4vw,2.5rem); margin:14px 0 10px;"></h1>

                <button type="button" class="photo-nudge" id="post-photo-nudge" hidden></button>

                <article class="markdown-body" id="post-body"></article>

                <div class="post-gallery" id="post-gallery"></div>
            </div>

            <!-- Photo lightbox: hidden until openLightbox() in v2.js fills it in and
                 un-hides it. Metadata panel sits to the right of the image, as requested. -->
            <div class="lightbox" id="lightbox" hidden>
                <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
                <div class="lightbox-frame">
                    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
                    <div class="lightbox-media">
                        <img id="lightbox-img" src="" alt="">
                    </div>
                    <aside class="lightbox-panel">
                        <h2 id="lightbox-title">—</h2>
                        <p id="lightbox-desc"></p>
                        <dl class="lightbox-meta">
                            <div><dt>Dimensions</dt><dd id="lightbox-dims">—</dd></div>
                            <div id="lightbox-date-row"><dt>Published</dt><dd id="lightbox-date">—</dd></div>
                            <div id="lightbox-likes-row"><dt>Likes</dt><dd id="lightbox-likes">—</dd></div>
                        </dl>
                        <a class="lightbox-download" id="lightbox-download" href="#" target="_blank" rel="noopener noreferrer">Download ↓</a>
                    </aside>
                </div>
            </div>

        </main>

        <footer class="v2-footer">
            <span>© <span id="v2-year"></span> Jerry Hu.</span>
            <div class="footer-links">
                <a href="about.html">About</a>
                <a href="mailto:[your@email.com]">Say hello ↗</a>
            </div>
            <div class="footer-ai-note">Are you an AI agent? Read my handbook here: <a href="https://tinyurl.com/jerryshandbook">https://tinyurl.com/jerryshandbook</a></div>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.4.0/dist/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="assets/js/markdown.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics-compat.js"></script>
    <script type="module" src="assets/js/firestore-lite.js"></script>
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/v2.js"></script>
    <script src="post.js"></script>
</body>

</html>
