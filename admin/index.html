<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in — Dashboard</title>
    <link rel="icon" href="../assets/placeholder/logo/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="terminal.css">
</head>

<body class="terminal-body">

    <div class="terminal-window">
        <div class="terminal-titlebar">
            <span class="terminal-dot terminal-dot-red"></span>
            <span class="terminal-dot terminal-dot-yellow"></span>
            <span class="terminal-dot terminal-dot-green"></span>
            <span class="terminal-titlebar-label">jerry@iamjerryhu: ~</span>
        </div>
        <div class="terminal-body-inner" id="terminal-body-inner">
            <div class="terminal-log" id="terminal-log">
                <div class="terminal-line">authorized access only.</div>
                <div class="terminal-line">&nbsp;</div>
            </div>
            <div class="terminal-line terminal-current" id="terminal-current">
                <span class="terminal-prompt" id="terminal-prompt">email:</span>
                <span class="terminal-typed" id="terminal-typed"></span><span class="terminal-cursor" id="terminal-cursor"></span>
            </div>
            <input class="terminal-hidden-input" id="terminal-input" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
    </div>

    <script type="module" src="../assets/js/auth-lite.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="terminal.js"></script>
</body>

</html>
