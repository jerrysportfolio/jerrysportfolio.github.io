<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard</title>
    <link rel="icon" href="../assets/placeholder/logo/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/v2.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body class="v2 admin-body">

    <header class="admin-topbar">
        <span class="logo"><span style="color:var(--accent)">@</span>iamjerryhu — Dashboard</span>
        <div class="admin-topbar-actions">
            <a class="btn btn-sm" href="../index.html" target="_blank" rel="noopener">View site ↗</a>
            <button class="btn btn-sm" id="sign-out">Sign out</button>
        </div>
    </header>

    <main class="admin-shell">
        <h1 class="admin-title">Analytics</h1>
        <p class="admin-sub">Live from Firestore — the same counters the public site writes to.</p>
        <div class="stat-grid" id="stat-grid">
            <div class="stat-tile"><div class="stat-value" id="stat-gallery-views">—</div><div class="stat-label">Gallery views</div></div>
            <div class="stat-tile"><div class="stat-value" id="stat-gallery-downloads">—</div><div class="stat-label">Gallery downloads</div></div>
            <div class="stat-tile"><div class="stat-value" id="stat-post-views">—</div><div class="stat-label">Total post views</div></div>
            <div class="stat-tile"><div class="stat-value" id="stat-post-count">—</div><div class="stat-label">Published posts</div></div>
        </div>

        <div class="editor-header">
            <h1 class="admin-title" style="margin-bottom:0;">Blog posts</h1>
            <a class="btn btn-primary" href="editor.html">+ New post</a>
        </div>

        <div class="admin-card">
            <table class="post-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Tag</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Views</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="post-table-body">
                    <tr><td colspan="6" class="empty-state">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="../assets/js/auth-lite.js"></script>
    <script type="module" src="../assets/js/firestore-lite.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="admin.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
